<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima App</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- TU CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 py-2 py-md-3">
    
    <div class="card-custom col-12 col-sm-11 col-md-10 col-lg-8 col-xl-6 text-center">

      <!-- BOTONES DE UTILIDAD -->
      <div class="mb-2 mb-md-3 d-flex gap-2 justify-content-center flex-wrap">
        <button id="themeToggle" class="btn btn-sm btn-info" onclick="toggleTheme()">🌙 Oscuro</button>
      </div>

      <h2 class="mb-2 mb-md-3 h4 h-md-2">🌤️ Consulta el clima</h2>

      <!-- INPUT -->
      <input 
        type="text" 
        id="cityInput" 
        class="form-control mb-2 form-control-responsive"
        placeholder="Ej: Santiago, Chile | Buenos Aires | Madrid"
        oninput="showSuggestions()"
      />

      <!-- SUGERENCIAS -->
      <div id="suggestions" class="suggestions"></div>

      <!-- BOTÓN -->
      <button 
        class="btn btn-custom mt-2 mt-md-3 w-100" 
        onclick="getWeather()">
        Buscar clima
      </button>

      <!-- HISTORIAL DE BÚSQUEDAS -->
      <div id="history" class="mt-3 mt-md-4"></div>

      <!-- RESULTADO -->
      <div id="result" class="mt-3 mt-md-4"></div>

      <!-- EJEMPLOS -->
      <small class="mt-2 mt-md-3 d-block text-example">
        Ejemplos válidos:  
        Santiago, Chile · Lima · New York · Tokyo · París
      </small>

    </div>

  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
